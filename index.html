<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研倒计时 · 喜庆动态版（每日鼓励更换）</title>
<style>
  :root{
    --red1:#5c0008;
    --red2:#8f0612;
    --red3:#c3111f;
    --red4:#e23a2e;
    --gold1:#ffd36a;
    --gold2:#fff1bd;
    --gold3:#ffb938;
    --text:#fffaf2;
    --muted:rgba(255,245,224,.82);
    --line:rgba(255,220,138,.36);
    --soft:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    min-height:100%;
    overflow:hidden;
    color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;
    background:#780810;
  }
  body{
    min-height:100vh;
    position:relative;
    background:
      radial-gradient(circle at 50% 14%, rgba(255,215,120,.22), transparent 28%),
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.08), transparent 18%),
      radial-gradient(circle at 88% 18%, rgba(255,255,255,.08), transparent 18%),
      linear-gradient(180deg, #71050f 0%, #a30915 34%, #ca181d 69%, #970710 100%);
  }

  .bg-glow,.sparkles,.fireworks,.petals{position:absolute; inset:0; pointer-events:none; overflow:hidden}
  .bg-glow::before,.bg-glow::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(40px);
    opacity:.42;
    animation:floatGlow 8s ease-in-out infinite alternate;
  }
  .bg-glow::before{
    width:360px;height:360px;left:7%;top:8%;
    background:rgba(255,206,90,.30);
  }
  .bg-glow::after{
    width:420px;height:420px;right:4%;bottom:4%;
    background:rgba(255,170,60,.18);
    animation-delay:1.2s;
  }
  @keyframes floatGlow{
    from{transform:translateY(0) scale(1)}
    to{transform:translateY(-20px) scale(1.08)}
  }

  .spark{
    position:absolute;
    width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,246,186,1) 0%, rgba(255,210,90,.78) 45%, rgba(255,210,90,0) 72%);
    animation:rise linear infinite;
    opacity:.56;
  }
  @keyframes rise{
    0%{transform:translateY(30px) scale(.75);opacity:0}
    15%{opacity:.76}
    100%{transform:translateY(-120vh) scale(1.2);opacity:0}
  }

  .petal{
    position:absolute;
    width:16px;height:12px;
    background:linear-gradient(135deg, rgba(255,235,185,.92), rgba(255,189,84,.86));
    border-radius:70% 0 70% 0;
    box-shadow:0 0 6px rgba(255,220,140,.16);
    opacity:.28;
    animation:petalFall linear infinite;
  }
  @keyframes petalFall{
    0%{transform:translateY(-10vh) rotate(0deg) translateX(0)}
    100%{transform:translateY(115vh) rotate(320deg) translateX(80px)}
  }

  .burst{
    position:absolute;
    width:160px;height:160px;border-radius:50%;
    background:
      radial-gradient(circle, rgba(255,235,162,.26) 0 5%, transparent 6% 100%),
      repeating-conic-gradient(from 0deg, rgba(255,215,113,.16) 0 8deg, transparent 8deg 20deg);
    mask:radial-gradient(circle, transparent 0 18%, #000 20% 70%, transparent 73%);
    -webkit-mask:radial-gradient(circle, transparent 0 18%, #000 20% 70%, transparent 73%);
    opacity:.38;
    animation:burstPulse 4s ease-in-out infinite;
    filter:drop-shadow(0 0 10px rgba(255,216,117,.16));
  }
  .b1{left:12%;top:8%}
  .b2{right:10%;top:10%;animation-delay:1.2s}
  .b3{left:18%;bottom:18%;width:110px;height:110px;animation-delay:2s;opacity:.25}
  .b4{right:16%;bottom:16%;width:120px;height:120px;animation-delay:.8s;opacity:.22}
  @keyframes burstPulse{
    0%,100%{transform:scale(.92);opacity:.20}
    50%{transform:scale(1.08);opacity:.42}
  }

  .shell{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }

  .frame{
    position:relative;
    width:100vw;
    min-height:100vh;
    border-radius:0;
    overflow:hidden;
    border:none;
    box-shadow:none;
    background:
      linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)),
      radial-gradient(circle at 50% 0%, rgba(255,224,132,.10), transparent 30%);
  }
  .frame::before{
    content:none;
  }

  .corner{
    display:none;
  }
  .corner::after{
    content:"";
    position:absolute;
    width:56px;height:56px;border-radius:50%;
    border:1px solid rgba(255,225,155,.20);
  }
  .corner.tl{top:28px;left:28px;border-top:3px solid;border-left:3px solid;border-top-left-radius:24px}
  .corner.tl::after{top:10px;left:10px}
  .corner.tr{top:28px;right:28px;border-top:3px solid;border-right:3px solid;border-top-right-radius:24px}
  .corner.tr::after{top:10px;right:10px}
  .corner.bl{bottom:28px;left:28px;border-bottom:3px solid;border-left:3px solid;border-bottom-left-radius:24px}
  .corner.bl::after{bottom:10px;left:10px}
  .corner.br{bottom:28px;right:28px;border-bottom:3px solid;border-right:3px solid;border-bottom-right-radius:24px}
  .corner.br::after{bottom:10px;right:10px}

  .coin{
    position:absolute;
    width:42px;height:42px;border-radius:50%;
    border:2px solid rgba(255,223,139,.58);
    background:radial-gradient(circle at 35% 30%, rgba(255,247,195,.92), rgba(255,193,66,.96) 68%, rgba(200,118,12,.96) 100%);
    box-shadow:0 6px 12px rgba(0,0,0,.14);
    animation:floatCoin 5.5s ease-in-out infinite;
    opacity:.9;
  }
  .coin::before{
    content:"";
    position:absolute; left:50%; top:50%;
    width:12px;height:12px;margin-left:-6px;margin-top:-6px;
    border-radius:3px;
    background:rgba(170,87,10,.76);
  }
  .coin.c1{left:135px;bottom:94px}
  .coin.c2{right:145px;bottom:88px;animation-delay:1.4s}
  @keyframes floatCoin{
    0%,100%{transform:translateY(0) rotate(0deg)}
    50%{transform:translateY(-8px) rotate(8deg)}
  }

  .cloud{
    position:absolute;
    width:240px;height:74px;
    background:rgba(255,220,160,.12);
    border-radius:60px;
    animation:drift 18s linear infinite;
  }
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud::before{width:90px;height:90px;left:28px;top:-28px}
  .cloud::after{width:120px;height:120px;right:20px;top:-42px}
  .c1{left:-80px;top:120px;animation-duration:24s}
  .c2{right:-120px;top:210px;animation-duration:28s;animation-direction:reverse}
  .c3{left:8%;bottom:140px;animation-duration:31s}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(160px)}}

  .lantern{
    position:absolute;
    top:40px;
    width:104px;height:132px;
    animation:swing 4.2s ease-in-out infinite;
    transform-origin:50% 0;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.18));
  }
  .lantern.left{left:70px}
  .lantern.right{right:70px;animation-delay:1.1s}
  .lantern .rope{
    position:absolute;top:-46px;left:50%;
    width:3px;height:48px;margin-left:-1.5px;
    background:linear-gradient(180deg,#fff0bd,#e0b54f);
  }
  .lantern .body{
    position:absolute;inset:0;
    border-radius:28px 28px 36px 36px;
    background:linear-gradient(180deg,#ff6452 0%, #d41321 48%, #a10a12 100%);
    border:2px solid rgba(255,228,159,.7);
    box-shadow:inset 0 12px 18px rgba(255,255,255,.13), inset 0 -16px 24px rgba(0,0,0,.16);
  }
  .lantern .body::before,.lantern .body::after{
    content:"";position:absolute;left:50%;width:72px;margin-left:-36px;
    height:10px;border-radius:999px;background:rgba(255,226,155,.8);
  }
  .lantern .body::before{top:10px}
  .lantern .body::after{bottom:10px}
  .lantern .mid{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:30px;font-weight:900;letter-spacing:.12em;color:#fff3c7;
    text-shadow:0 0 8px rgba(255,244,189,.25);
  }
  .lantern .tail{
    position:absolute;left:50%;bottom:-18px;width:30px;height:24px;margin-left:-15px;
    border-radius:0 0 20px 20px;background:linear-gradient(180deg,#ffd96d,#cc8b12);
  }
  .lantern .tail::after{
    content:"";position:absolute;left:50%;top:18px;width:3px;height:48px;margin-left:-1.5px;
    background:linear-gradient(180deg,#ffd96d,#b66d00);
  }
  @keyframes swing{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}

  .content{
    position:relative;
    z-index:2;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:90px 48px 110px;
  }

  .top-badge{
    display:inline-flex;align-items:center;gap:16px;
    font-size:clamp(16px,1.2vw,24px);
    color:var(--gold2);
    letter-spacing:.34em;font-weight:700;
    margin-bottom:18px;
  }
  .top-badge::before,.top-badge::after{
    content:"";width:min(130px,10vw);height:1px;
    background:linear-gradient(90deg,transparent, rgba(255,230,159,.95));
  }
  .top-badge::after{
    background:linear-gradient(90deg, rgba(255,230,159,.95), transparent);
  }

  .title{
    position:relative;
    margin:0;
    font-size:clamp(56px,5.4vw,108px);
    line-height:1.08;
    font-weight:900;
    letter-spacing:.14em;
    color:transparent;
    background:linear-gradient(180deg,var(--gold2) 0%, #ffd86d 36%, #ffbb32 68%, #fff0a7 100%);
    -webkit-background-clip:text;
    background-clip:text;
    animation:titlePulse 3.4s ease-in-out infinite;
  }
  .title::after{
    content:"";
    position:absolute;top:0;left:-32%;width:28%;height:100%;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.34), rgba(255,255,255,0));
    transform:skewX(-18deg);
    animation:shine 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shine{0%{left:-35%}55%{left:110%}100%{left:110%}}
  @keyframes titlePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}

  .subtitle{
    margin-top:14px;
    font-size:clamp(18px,1.4vw,28px);
    color:var(--muted);
    letter-spacing:.18em;
  }

  .count-label{
    margin-top:34px;
    font-size:clamp(20px,1.55vw,30px);
    color:#fff2cf;
    letter-spacing:.28em;
  }
  .days-row{
    display:flex;align-items:flex-end;justify-content:center;gap:22px;margin-top:8px;
  }
  .days{
    font-size:clamp(120px,16vw,260px);
    line-height:.88;
    font-weight:900;
    letter-spacing:-.07em;
    font-variant-numeric:tabular-nums;
    color:#fff8e4;
    text-shadow:0 0 18px rgba(255,222,125,.16), 0 0 40px rgba(255,200,60,.11);
  }
  .day-unit{
    padding-bottom:1.2vw;
    font-size:clamp(32px,3.6vw,64px);
    color:var(--gold1);
    font-weight:900;
    letter-spacing:.18em;
  }

  .time-grid{
    margin-top:26px;
    width:min(980px,84vw);
    display:grid;
    grid-template-columns:1fr auto 1fr auto 1fr;
    gap:18px;align-items:center;
  }
  .time-card{
    position:relative;
    padding:22px 10px 18px;
    border-radius:24px;
    background:linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.045));
    border:1px solid rgba(255,231,170,.20);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
    overflow:hidden;
  }
  .time-card::before{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,0) 35%);
  }
  .time-card::after{
    content:"";
    position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg, transparent, rgba(255,239,185,.66), transparent);
  }
  .time-num{
    position:relative;z-index:1;
    font-size:clamp(46px,5vw,82px);
    font-weight:900;
    font-variant-numeric:tabular-nums;
    color:#fff9ec;
  }
  .time-text{
    position:relative;z-index:1;
    margin-top:8px;
    font-size:clamp(15px,1.05vw,18px);
    letter-spacing:.28em;color:var(--muted);
  }
  .colon{
    color:var(--gold1);
    font-size:clamp(34px,3.8vw,58px);
    transform:translateY(-10px);
  }

  .motto{
    position:relative;
    margin-top:42px;
    padding:24px 48px;
    border-radius:999px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.055)),
      radial-gradient(circle at 50% 0%, rgba(255,223,124,.12), transparent 60%);
    border:1px solid rgba(255,232,176,.34);
    font-size:clamp(24px,1.95vw,38px);
    font-weight:900;
    letter-spacing:.16em;
    color:#fff5d7;
    text-shadow:0 2px 0 rgba(90,0,0,.20), 0 0 16px rgba(255,220,120,.10);
    box-shadow:
      0 8px 24px rgba(90,0,0,.18),
      inset 0 1px 0 rgba(255,255,255,.14);
    min-width:min(800px,82vw);
    overflow:hidden;
  }
  .motto::before{
    content:"";
    position:absolute;
    left:-25%;
    top:0;
    width:22%;
    height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    transform:skewX(-20deg);
    animation:mottoShine 6s ease-in-out infinite;
  }
  .motto::after{
    content:"✦";
    position:absolute;
    right:24px;
    top:50%;
    transform:translateY(-50%);
    color:rgba(255,224,145,.68);
    font-size:18px;
  }
  @keyframes mottoShine{
    0%{left:-28%}
    45%{left:112%}
    100%{left:112%}
  }
  .small-motto{
    margin-top:17px;
    font-size:clamp(18px,1.25vw,25px);
    font-weight:700;
    color:rgba(255,245,224,.88);
    letter-spacing:.10em;
    min-height:1.6em;
    text-shadow:0 1px 8px rgba(80,0,0,.18);
  }

  .bottom-wave{
    position:absolute;
    left:-8%;right:-8%;bottom:-50px;height:190px;
    background:
      radial-gradient(120% 100% at 10% 100%, rgba(255,255,255,.16) 0, rgba(255,255,255,0) 48%),
      linear-gradient(180deg, #c51421 0%, #980a13 100%);
    border-radius:50% 50% 0 0/80% 80% 0 0;
    box-shadow:0 -10px 30px rgba(124,0,11,.2);
  }
  .bottom-wave::before{
    content:"";
    position:absolute;left:-3%;right:-3%;bottom:26px;height:100px;
    border-radius:50% 50% 0 0/100% 100% 0 0;
    background:linear-gradient(180deg, rgba(255,90,90,.35), rgba(255,255,255,0));
    opacity:.75;
  }

  .settings-btn{
    position:absolute;right:24px;bottom:24px;z-index:4;
    width:42px;height:42px;border:none;border-radius:50%;
    background:rgba(255,255,255,.14);
    color:rgba(255,250,235,.82);cursor:pointer;font-size:18px;
    backdrop-filter:blur(4px);
  }
  .settings-panel{
    position:absolute;right:24px;bottom:76px;z-index:5;
    width:min(430px,calc(100vw - 48px));
    background:rgba(99,8,16,.97);
    border:1px solid rgba(255,226,161,.24);
    border-radius:22px;padding:20px;
    box-shadow:0 18px 42px rgba(50,0,0,.35);
    display:none;
  }
  .settings-panel.open{display:block}
  .settings-title{
    font-size:18px;font-weight:800;color:#fff0c0;
    margin-bottom:14px;letter-spacing:.08em;
  }
  .row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
  .field label{
    display:block;margin-bottom:8px;font-size:13px;color:rgba(255,244,217,.78);
  }
  select{
    width:100%;background:#7b0d16;color:#fff7e5;
    border:1px solid rgba(255,226,161,.24);border-radius:12px;
    padding:11px 10px;font-size:16px;outline:none;
  }
  .actions{display:flex;gap:10px;margin-top:14px}
  .actions button{
    flex:1;min-height:42px;border:none;border-radius:12px;cursor:pointer;font-size:15px;
  }
  .btn-secondary{background:rgba(255,255,255,.12);color:#fff8e8}
  .btn-primary{
    background:linear-gradient(180deg, #ffd86d 0%, #f0b335 100%);
    color:#6a0b10;font-weight:900;
  }
  .tip{
    margin-top:12px;font-size:12px;color:rgba(255,244,217,.68);line-height:1.6;
  }


  /* 华丽增强：金色卷纹、光环、侧边祥云 */
  .count-halo{
    position:absolute;
    left:50%;
    top:48%;
    width:min(920px,70vw);
    height:min(420px,38vw);
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
      radial-gradient(ellipse at center, rgba(255,228,146,.12) 0%, rgba(255,190,55,.06) 38%, transparent 70%);
    filter:blur(2px);
    pointer-events:none;
    animation:haloBreath 4.8s ease-in-out infinite;
    z-index:0;
  }
  @keyframes haloBreath{
    0%,100%{transform:translate(-50%,-50%) scale(.96);opacity:.58}
    50%{transform:translate(-50%,-50%) scale(1.05);opacity:.9}
  }

  .gold-divider{
    width:min(980px,78vw);
    height:20px;
    margin:20px auto 0;
    position:relative;
  }
  .gold-divider::before,
  .gold-divider::after{
    content:"";
    position:absolute;
    top:9px;
    width:44%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,222,135,.82));
  }
  .gold-divider::before{left:0}
  .gold-divider::after{right:0;transform:scaleX(-1)}
  .gold-divider span{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) rotate(45deg);
    width:12px;height:12px;
    border:1px solid rgba(255,226,145,.85);
    background:rgba(255,201,75,.18);
    box-shadow:0 0 12px rgba(255,219,126,.18);
  }

  .side-ribbon{
    position:absolute;
    top:29%;
    width:72px;
    padding:18px 10px 20px;
    border:1px solid rgba(255,226,153,.34);
    border-radius:18px 18px 30px 30px;
    background:linear-gradient(180deg, rgba(145,7,18,.88), rgba(102,4,12,.82));
    color:#ffe9aa;
    font-size:22px;
    font-weight:900;
    line-height:1.4;
    letter-spacing:.18em;
    text-align:center;
    box-shadow:0 12px 26px rgba(70,0,0,.18), inset 0 1px 0 rgba(255,255,255,.08);
    z-index:1;
  }
  .side-ribbon::before{
    content:"";
    position:absolute;
    left:50%;
    top:-18px;
    width:34px;height:34px;
    transform:translateX(-50%) rotate(45deg);
    border:1px solid rgba(255,224,145,.45);
    background:rgba(255,198,69,.12);
  }
  .side-ribbon.left{left:34px}
  .side-ribbon.right{right:34px}
  .side-ribbon.right span{display:block}

  .cloud-line{
    position:absolute;
    left:4%;
    right:4%;
    bottom:76px;
    height:34px;
    opacity:.30;
    pointer-events:none;
    background:
      radial-gradient(circle at 3% 50%, transparent 0 13px, rgba(255,226,158,.9) 14px 15px, transparent 16px),
      radial-gradient(circle at 10% 50%, transparent 0 13px, rgba(255,226,158,.75) 14px 15px, transparent 16px);
    background-size:90px 34px;
    background-repeat:repeat-x;
    animation:cloudFlow 26s linear infinite;
  }
  @keyframes cloudFlow{
    from{background-position-x:0}
    to{background-position-x:180px}
  }

  .title-crown{
    margin-bottom:8px;
    color:rgba(255,227,151,.88);
    font-size:24px;
    letter-spacing:.3em;
    animation:crownPulse 3s ease-in-out infinite;
  }
  @keyframes crownPulse{
    0%,100%{opacity:.66;transform:translateY(0)}
    50%{opacity:1;transform:translateY(-2px)}
  }


  .frame:fullscreen .settings-btn,
  .frame:fullscreen .settings-panel,
  .frame:-webkit-full-screen .settings-btn,
  .frame:-webkit-full-screen .settings-panel,
  body:fullscreen .settings-btn,
  body:fullscreen .settings-panel,
  body:-webkit-full-screen .settings-btn,
  body:-webkit-full-screen .settings-panel{
    display:none !important;
  }



  .settings-btn.presentation-hidden{
    opacity:0;
    pointer-events:none;
  }
  .settings-btn{
    transition:opacity .35s ease, transform .25s ease;
  }
  .settings-btn:not(.presentation-hidden):hover{
    transform:scale(1.06);
  }

  /* 2848×1600 大屏专用优化 */
  @media (min-width: 2400px) and (min-height: 1300px){
    .content{
      padding:118px 110px 150px;
      justify-content:center;
    }

    .top-badge{
      font-size:28px;
      margin-bottom:22px;
      letter-spacing:.38em;
    }

    .title-crown{
      font-size:30px;
      margin-bottom:12px;
    }

    .title{
      font-size:128px;
      letter-spacing:.16em;
    }

    .gold-divider{
      width:1160px;
      margin-top:26px;
    }

    .subtitle{
      margin-top:18px;
      font-size:31px;
      letter-spacing:.20em;
    }

    .count-label{
      margin-top:46px;
      font-size:34px;
      letter-spacing:.32em;
    }

    .days-row{
      gap:28px;
      margin-top:10px;
    }

    .days{
      font-size:310px;
      line-height:.86;
    }

    .day-unit{
      font-size:78px;
      padding-bottom:28px;
    }

    .time-grid{
      width:1180px;
      gap:24px;
      margin-top:34px;
    }

    .time-card{
      padding:28px 18px 24px;
      border-radius:30px;
    }

    .time-num{
      font-size:92px;
    }

    .time-text{
      margin-top:10px;
      font-size:22px;
      letter-spacing:.30em;
    }

    .colon{
      font-size:68px;
      transform:translateY(-12px);
    }

    .motto{
      min-width:980px;
      margin-top:50px;
      padding:28px 58px;
      font-size:42px;
      border-radius:999px;
    }

    .small-motto{
      margin-top:20px;
      font-size:28px;
      letter-spacing:.12em;
    }

    .lantern{
      top:48px;
      width:124px;
      height:158px;
    }

    .lantern.left{left:100px}
    .lantern.right{right:100px}

    .lantern .mid{
      font-size:36px;
    }

    .side-ribbon{
      top:31%;
      width:86px;
      padding:22px 12px 24px;
      font-size:27px;
      border-radius:20px 20px 34px 34px;
    }

    .side-ribbon.left{left:58px}
    .side-ribbon.right{right:58px}

    .coin{
      width:50px;
      height:50px;
    }

    .coin.c1{left:180px;bottom:122px}
    .coin.c2{right:190px;bottom:118px}

    .cloud-line{
      bottom:92px;
      left:3%;
      right:3%;
    }

    .settings-btn{
      right:34px;
      bottom:34px;
      width:46px;
      height:46px;
      font-size:20px;
    }

    .settings-panel{
      right:34px;
      bottom:92px;
      width:470px;
    }
  }

  @media (max-width: 900px){
    body{overflow:auto}
    .frame{min-height:100vh}
    .content{padding:88px 22px 90px}
    .time-grid{grid-template-columns:1fr 1fr 1fr;width:100%;gap:12px}
    .colon{display:none}
    .lantern{width:76px;height:98px;top:28px}
    .lantern.left{left:20px}
    .lantern.right{right:20px}
    .motto{border-radius:26px;padding:18px 20px;line-height:1.5;min-width:0;width:100%}
    .settings-panel{right:14px;bottom:68px;width:calc(100vw - 28px)}
    .settings-btn{right:14px;bottom:14px}
    .corner{width:96px;height:96px}
    .coin{display:none}
    .side-ribbon{display:none}
    .gold-divider{width:88vw}
    .count-halo{width:90vw;height:48vw}
  }

  @media (prefers-reduced-motion: reduce){
    .spark,.lantern,.title,.title::after,.cloud,.bg-glow::before,.bg-glow::after,.petal,.burst,.coin,.count-halo,.cloud-line,.title-crown,.motto::before{animation:none}
  }
  .zc-brand{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 16px;color:#ffe8a3;flex-shrink:0}
  .zc-brand svg{display:none}
  .zc-logo{width:76px;height:76px;border-radius:50%;overflow:hidden;background:transparent;position:relative;flex-shrink:0}
  .zc-logo img{position:absolute;width:155.5%;height:auto;max-width:none;left:-38.5%;top:-42.9%}
  .zc-brand-name{font-size:26px;font-weight:800;letter-spacing:.16em;line-height:1.15}
  .zc-brand-en{font-size:9px;letter-spacing:.27em;opacity:.75;margin-top:5px}
  @media(min-width:2400px) and (min-height:1300px){.zc-brand{gap:16px}.zc-brand svg{width:56px;height:56px}.zc-brand-name{font-size:36px}.zc-brand-en{font-size:11px}}
  @media(max-width:900px){.zc-brand svg{width:32px;height:32px}.zc-brand-name{font-size:21px}.zc-brand-en{font-size:8px}}
</style>

      <div class="days-row">
        <div class="days" id="days">---</div>
        <div class="day-unit">天</div>
      </div>

      <div class="time-grid">
        <div class="time-card">
          <div class="time-num" id="hours">--</div>
          <div class="time-text">小时</div>
        </div>
        <div class="colon">:</div>
        <div class="time-card">
          <div class="time-num" id="minutes">--</div>
          <div class="time-text">分钟</div>
        </div>
        <div class="colon">:</div>
        <div class="time-card">
          <div class="time-num" id="seconds">--</div>
          <div class="time-text">秒</div>
        </div>
      </div>

      <div class="motto" id="dailyMotto"><strong>全力以赴，不留遗憾</strong></div>
      <div class="small-motto" id="dailySubMotto">所有翻过的书页，都会变成上岸时的光</div>
    </div>

    <div class="bottom-wave"></div>

    <button id="settingsBtn" class="settings-btn" title="设置日期">⚙</button>
    <div id="settingsPanel" class="settings-panel">
      <div class="settings-title">设置目标日期</div>
      <div class="row">
        <div class="field">
          <label>年份</label>
          <select id="year"></select>
        </div>
        <div class="field">
          <label>月份</label>
          <select id="month"></select>
        </div>
        <div class="field">
          <label>日期</label>
          <select id="day"></select>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn-secondary" id="closeSettings">关闭</button>
        <button type="button" class="btn-primary" id="saveSettings">保存</button>
      </div>
      <div class="tip">设置后会自动保存在这台电脑浏览器里。底部鼓励语会按日期每天顺序切换一组，全部播放完后自动从第一组重新循环。投屏时按 F11 可以全屏播放。</div>
    </div>
  </div>
</div>

<script>
(function(){
  const DEFAULT = { y: 2026, m: 12, d: 19 };
  const DAILY_QUOTES = [
    ["全力以赴，不留遗憾", "今天多坚持一点，明天就离上岸更近一点"],
    ["你不是在熬日子，你是在攒实力", "每一次坐下学习，都是在为未来铺路"],
    ["所有的努力，都会在考场上发光", "今天翻过的每一页，都会成为明天的底气"],
    ["慢一点没关系，别停下就好", "稳住节奏，持续前进，结果会回应你的坚持"],
    ["此刻吃的苦，终会变成捷报", "你现在走的每一步，都算数"],
    ["乾坤未定，你我皆是黑马", "别急着否定自己，你比想象中更强"],
    ["再难的日子，也挡不住想上岸的人", "扛过去，答案就在前面"],
    ["把普通的日子过得坚定，就是不普通", "今天的认真，终会换来未来的从容"],
    ["你的努力，岁月都看得见", "坚持不是口号，而是一天一天做出来的"],
    ["山高有路，书山可攀", "你走过的每一步，都会带你靠近理想"],
    ["星光不负赶路人", "那些默默努力的夜晚，终会照亮结果"],
    ["现在的拼搏，是为了以后有更多选择", "忍住一时辛苦，换来长久安心"],
    ["保持清醒，保持热爱，保持冲刺", "你离目标，不是很远，而是越来越近"],
    ["今天很累，但你没有白累", "每一次专注，都是在为自己加分"],
    ["你见过凌晨的灯，也会见到录取的喜", "所有坚持，终将有回响"],
    ["学习不是一蹴而就，成长也是", "别怕慢，只要一直向前"],
    ["熬得住寂寞，才等得到花开", "那些看似平凡的积累，最有力量"],
    ["越努力，越幸运；越坚持，越接近成功", "把焦虑化成行动，把目标写进今天"],
    ["不为模糊的未来担忧，只为清晰的现在努力", "今天学进去的，都是明天的底牌"],
    ["你现在的样子，就是未来最骄傲的伏笔", "再坚持一下，惊喜正在赶来的路上"],
    ["心有所向，步履不停", "只要还在学，就一直在赢回主动权"],
    ["今天认真一点，明天轻松一点", "积少成多，聚沙成塔，上岸也是一样"],
    ["努力到无能为力，拼搏到感动自己", "你咬牙坚持的每一天，都很了不起"],
    ["日拱一卒，功不唐捐", "再平凡的进步，长期坚持都会很厉害"],
    ["上岸的路，也许难，但你值得", "请相信：你为梦想付出的，都不会白费"],
    ["不是因为看见希望才坚持，而是坚持了才看见希望", "别怀疑自己，你正在变得越来越强"],
    ["愿你以梦为马，不负韶华", "那些熬过的夜，都会照亮未来的名字"],
    ["你只管努力，剩下的交给时间", "当下这一刻，就是逆风翻盘的起点"],
    ["每一分努力，都在向录取通知书靠近", "看似不起波澜的日复一日，会突然看到坚持的意义"],
    ["请继续闪闪发光，直到站上属于你的舞台", "愿你笔下有锋芒，心中有方向，结果有回报"]
  ];

  const $ = id => document.getElementById(id);

  const daysEl = $("days");
  const hoursEl = $("hours");
  const minutesEl = $("minutes");
  const secondsEl = $("seconds");
  const yearEl = $("year");
  const monthEl = $("month");
  const dayEl = $("day");
  const settingsBtn = $("settingsBtn");
  const settingsPanel = $("settingsPanel");
  const closeSettings = $("closeSettings");
  const saveSettings = $("saveSettings");
  const dailyMottoEl = $("dailyMotto");
  const dailySubMottoEl = $("dailySubMotto");

  let target = { ...DEFAULT };
  try{
    const saved = localStorage.getItem("kaoyan_daily_quote_target");
    if(saved){
      const obj = JSON.parse(saved);
      if(obj && Number.isInteger(obj.y) && Number.isInteger(obj.m) && Number.isInteger(obj.d)){
        target = obj;
      }
    }
  }catch(e){}

  function daysInMonth(y,m){
    return new Date(y, m, 0).getDate();
  }

  function validDate(obj){
    if(!obj) return false;
    if(!Number.isInteger(obj.y) || !Number.isInteger(obj.m) || !Number.isInteger(obj.d)) return false;
    if(obj.y < 2025 || obj.y > 2035) return false;
    if(obj.m < 1 || obj.m > 12) return false;
    return obj.d >= 1 && obj.d <= daysInMonth(obj.y, obj.m);
  }

  if(!validDate(target)) target = { ...DEFAULT };

  for(let y=2025; y<=2035; y++){
    const op = document.createElement("option");
    op.value = y;
    op.textContent = y + "年";
    yearEl.appendChild(op);
  }
  for(let m=1; m<=12; m++){
    const op = document.createElement("option");
    op.value = m;
    op.textContent = m + "月";
    monthEl.appendChild(op);
  }

  function refillDays(){
    const y = Number(yearEl.value);
    const m = Number(monthEl.value);
    const max = daysInMonth(y, m);
    const old = Number(dayEl.value) || 1;
    dayEl.innerHTML = "";
    for(let d=1; d<=max; d++){
      const op = document.createElement("option");
      op.value = d;
      op.textContent = d + "日";
      dayEl.appendChild(op);
    }
    dayEl.value = String(Math.min(old, max));
  }

  function applySelects(){
    yearEl.value = String(target.y);
    monthEl.value = String(target.m);
    refillDays();
    dayEl.value = String(target.d);
  }

  yearEl.addEventListener("change", refillDays);
  monthEl.addEventListener("change", refillDays);

  function targetTime(){
    return new Date(target.y, target.m - 1, target.d, 0, 0, 0, 0).getTime();
  }

  function tick(){
    const diff = targetTime() - Date.now();
    if(diff <= 0){
      daysEl.textContent = "0";
      hoursEl.textContent = "00";
      minutesEl.textContent = "00";
      secondsEl.textContent = "00";
      return;
    }
    const total = Math.floor(diff / 1000);
    daysEl.textContent = String(Math.floor(total / 86400));
    hoursEl.textContent = String(Math.floor((total % 86400) / 3600)).padStart(2, "0");
    minutesEl.textContent = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
    secondsEl.textContent = String(total % 60).padStart(2, "0");
  }

  function setDailyQuote(){
    // 以 2026-08-28 为第 1 句起点，之后每天按数组顺序播放；
    // 播放到最后一句后，会自动回到第 1 句继续循环。
    const now = new Date();
    const todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    const anchorUTC = Date.UTC(2026, 7, 28);
    const daysPassed = Math.floor((todayUTC - anchorUTC) / 86400000);

    // 兼容锚点之前的日期，也能正确循环。
    const dayIndex = ((daysPassed % DAILY_QUOTES.length) + DAILY_QUOTES.length) % DAILY_QUOTES.length;
    const pair = DAILY_QUOTES[dayIndex];

    dailyMottoEl.textContent = pair[0];
    dailySubMottoEl.textContent = pair[1];
  }

  settingsBtn.addEventListener("click", function(){
    applySelects();
    settingsPanel.classList.toggle("open");
  });

  closeSettings.addEventListener("click", function(){
    settingsPanel.classList.remove("open");
  });

  saveSettings.addEventListener("click", function(){
    const next = {
      y: Number(yearEl.value),
      m: Number(monthEl.value),
      d: Number(dayEl.value)
    };
    if(!validDate(next)){
      alert("日期无效，请重新选择");
      return;
    }
    target = next;
    try{
      localStorage.setItem("kaoyan_daily_quote_target", JSON.stringify(target));
    }catch(e){}
    settingsPanel.classList.remove("open");
    tick();
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      settingsPanel.classList.remove("open");
    }
  });

  // 大厅展示：几秒无操作后自动隐藏右下角设置按钮。
  // 即使用浏览器 F11 全屏也有效；移动鼠标后会暂时重新出现。
  let hideTimer = null;
  function scheduleHideSettings(){
    clearTimeout(hideTimer);
    settingsBtn.classList.remove("presentation-hidden");
    if(!settingsPanel.classList.contains("open")){
      hideTimer = setTimeout(function(){
        settingsBtn.classList.add("presentation-hidden");
      }, 3500);
    }
  }

  document.addEventListener("mousemove", scheduleHideSettings);
  document.addEventListener("touchstart", scheduleHideSettings, {passive:true});

  settingsBtn.addEventListener("click", function(){
    clearTimeout(hideTimer);
    settingsBtn.classList.remove("presentation-hidden");
  });

  closeSettings.addEventListener("click", scheduleHideSettings);
  saveSettings.addEventListener("click", scheduleHideSettings);


  function createSparkles(){
    const box = $("sparkles");
    const count = 24;
    for(let i=0;i<count;i++){
      const s = document.createElement("span");
      s.className = "spark";
      s.style.left = (Math.random()*100).toFixed(2) + "%";
      s.style.top = (70 + Math.random()*35).toFixed(2) + "%";
      s.style.animationDuration = (8 + Math.random()*8).toFixed(2) + "s";
      s.style.animationDelay = (-Math.random()*12).toFixed(2) + "s";
      s.style.transform = "scale(" + (0.7 + Math.random()*0.8).toFixed(2) + ")";
      box.appendChild(s);
    }
  }

  function createPetals(){
    const box = $("petals");
    const count = 10;
    for(let i=0;i<count;i++){
      const p = document.createElement("span");
      p.className = "petal";
      p.style.left = (Math.random()*100).toFixed(2) + "%";
      p.style.animationDuration = (15 + Math.random()*12).toFixed(2) + "s";
      p.style.animationDelay = (-Math.random()*18).toFixed(2) + "s";
      p.style.opacity = (0.18 + Math.random()*0.18).toFixed(2);
      p.style.transform = "scale(" + (0.7 + Math.random()*0.7).toFixed(2) + ")";
      box.appendChild(p);
    }
  }

  createSparkles();
  createPetals();
  scheduleHideSettings();
  applySelects();
  setDailyQuote();
  tick();
  setInterval(tick, 1000);
  setInterval(setDailyQuote, 60000);
})();
</script>
</body>
</html>
